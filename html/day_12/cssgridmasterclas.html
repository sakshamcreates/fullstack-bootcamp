<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css-gridmaster-class</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        margin: 0px;
        padding: 20px;
        background-color: antiquewhite;
    }
    h1,h2{
        color: black;
    }
    .grid-conatainer{
        display: grid;
        grid-template-columns: auto auto auto;
        background-color: dodgerblue;
        padding: 10px;
        margin: 0px;
    }
    .box{
        background-color: #f1f1f1;
        border: 1px solid black;
        padding: 10px;
       font-size: 40px;
       text-align: center;
       font-style: italic;
       font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;


    }
</style>
<body>
    <h1>
        CSS GRID MASTERCLASS
    </h1>
    <div class="container">
        <h2>1. Basic grid (3*3)</h2>
        
        <div class="grid-conatainer">
<div class="box">1</div>
<div class="box">2</div>
<div class="box">3</div>
<div class="box">4</div>
<div class="box">5</div>
<div class="box">6</div>
<div class="box">7</div>
<div class="box">8</div>
<div class="box">9</div>

        </div>
    </div>
</body>
</html>
