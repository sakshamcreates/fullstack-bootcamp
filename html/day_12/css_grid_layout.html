<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
        margin: 0px;
        background-color: antiquewhite;
    }
    h1{
        font-size: 40px;
    }
    h2{
        font-size: 30px;
        color: cadetblue;

    }
    .container{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr ;
        grid-template-rows: 2fr 1fr 2fr ;
    }
</style>
<body>
    <h1>
        css grid layout
    </h1>
    <div class="container">
       <div class="header">
        <h2>welcome guest...</h2>
       </div>
       <div class="container">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Libero incidunt dolorem eius facere rerum delectus fugiat alias quos voluptatem dolores itaque aperiam, repellat ratione necessitatibus ipsa inventore voluptate in corporis!</p>
        <div class="grid-container">
            <div class="box"><a href="#">link1</a></div>
<div class="box"><a href="#">link2</a></div>
<div class="box"><a href="#">link3</a></div>
            <div class="box"><a href="#">link4</a></div>
        </div>
        <div class="footer"><h4>footer</h4></div>
       </div>
    </div>
</body>
</html>
