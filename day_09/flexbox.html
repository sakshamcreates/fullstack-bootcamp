<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXBOX</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.5;
            margin: 0px;
            padding: 20px;
            background-color: rgb(246, 251, 255);
        }
        h1,h2{
            color: #333;
        }
        .container{
            background-color: beige;
            border: 2px solid;
            margin-bottom: 20px;
        padding: 10px;
    }
    .flex-container{
        display: flex;
        height: 200px;
        margin-bottom: 10px;
    }
    .circle
    {
       width: 50px;
       height: 50px;
       border-radius: 50%;
       display: flex;
       justify-content: center;
       align-items: center;
       font-weight: bold;
       margin: 5px;
    }
    .pastel-1{
        background-color: pink;
    }
    .pastel-2{
        background-color: green;
    }
    .pastel-3{
        background-color: navajowhite;
    }
    .pastel-4{
        background-color: chartreuse;
    }
    .pastel-5{
        background-color: coral;
    }
    .flex-containerr{
        display: flex;
        justify-content: space-between;
        
    }
    </style>
</head>
<body>
    <H1 class="flex">Flexbox masterclass demo</H1>
    <div class="container">
        <h2>1. default Flex (row) </h2>
        <div class="content"
        style="flex-direction:row;">
            <div class="circle pastel-1">1</div>
            <div class="circle pastel-2">2</div>
            <div class="circle pastel-3">3</div>
            <div class="circle pastel-4">4</div>
            <div class="circle pastel-5">5</div>
        </div>
    </div>
    <div class="container">
        <h2>2. flex direction: column</h2>
        <div class="flex-container"
        style="flex-direction: column;">
<div class="circle pastel-1">1</div>
<div class="circle pastel-2">2</div>
<div class="circle pastel-3">3</div>
<div class="circle pastel-4">4</div>
<div class="circle pastel-5">5</div>
        </div>
    </div>
    <div class="container">
        <h2>3.justify-content:space</h2>
         <div class="flex-containerr">
<div class="circle pastel-1">1</div>
<div class="circle pastel-2">2</div>
<div class="circle pastel-3">3</div>
<div class="circle pastel-4">4</div>
<div class="circle pastel-5">5</div>
        </div>
    </div>
</body>
</html>
